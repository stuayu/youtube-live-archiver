services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: archiver
      POSTGRES_USER: archiver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archiver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiver -d archiver"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://archiver:${POSTGRES_PASSWORD:-archiver}@db:5432/archiver
      STORAGE_ROOT: /archive
      YT_DLP_PATH: yt-dlp
      FFMPEG_PATH: ffmpeg
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATABASE_CONNECT_RETRY_SECONDS: ${DATABASE_CONNECT_RETRY_SECONDS:-30}
    volumes:
      - ${ARCHIVE_PATH:-./archive}:/archive
    ports: ["8000:8000"]
    stop_grace_period: 30s
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
